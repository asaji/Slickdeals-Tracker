<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slickdeals Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; color: #f8fafc; }
    header span { font-size: 1.5rem; }

    .stats-bar {
      display: flex;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      flex-wrap: wrap;
    }
    .stat-chip {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .stat-chip strong { color: #f8fafc; }

    .toolbar {
      padding: 0.75rem 1.5rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
    }
    .toolbar input[type=search] {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
      width: 220px;
    }
    .filter-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #334155;
      color: #f8fafc;
      border-color: #64748b;
    }
    .filter-btn.great.active  { background: #14532d; border-color: #22c55e; color: #86efac; }
    .filter-btn.good.active   { background: #14532d; border-color: #86efac; color: #bbf7d0; }
    .filter-btn.fair.active   { background: #451a03; border-color: #fbbf24; color: #fde68a; }
    .filter-btn.skip.active   { background: #450a0a; border-color: #f87171; color: #fca5a5; }

    .refresh-info {
      margin-left: auto;
      font-size: 0.75rem;
      color: #475569;
    }

    main { padding: 1rem 1.5rem; }

    .deals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .deal-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
    }
    .deal-card:hover { border-color: #64748b; }

    .deal-card.seen { opacity: 0.5; }

    .card-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #0f172a;
    }
    .card-img-placeholder {
      width: 100%;
      height: 140px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .card-body { padding: 0.85rem; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }

    .badge {
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-verdict { color: #0f172a; }
    .badge-category { background: #1e3a5f; color: #93c5fd; }
    .badge-store    { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

    .card-price {
      font-size: 1rem;
      font-weight: 700;
      color: #22c55e;
    }
    .card-price .was {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 400;
      text-decoration: line-through;
    }
    .card-price .discount {
      font-size: 0.75rem;
      color: #fbbf24;
      font-weight: 600;
    }

    .card-footer {
      padding: 0.6rem 0.85rem;
      border-top: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-footer .score { font-size: 0.75rem; color: #64748b; }
    .card-footer .score strong { color: #94a3b8; }

    .btn-view {
      margin-left: auto;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-view:hover { background: #2563eb; }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: #475569;
      grid-column: 1 / -1;
    }
    .empty-state p { margin-top: 0.5rem; font-size: 0.9rem; }

    #loading {
      text-align: center;
      padding: 4rem;
      color: #475569;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

<header>
  <span>🔥</span>
  <h1>Slickdeals Tracker</h1>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat-chip">Loading stats…</div>
</div>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="Search deals…" oninput="applyFilters()" />
  <button class="filter-btn active" data-verdict="all"    onclick="setVerdictFilter('all')">All</button>
  <button class="filter-btn great"  data-verdict="GREAT DEAL" onclick="setVerdictFilter('GREAT DEAL')">Great</button>
  <button class="filter-btn good"   data-verdict="GOOD DEAL"  onclick="setVerdictFilter('GOOD DEAL')">Good</button>
  <button class="filter-btn fair"   data-verdict="FAIR DEAL"  onclick="setVerdictFilter('FAIR DEAL')">Fair</button>
  <button class="filter-btn skip"   data-verdict="SKIP"       onclick="setVerdictFilter('SKIP')">Skip</button>
  <button class="filter-btn"        data-verdict="unanalyzed" onclick="setVerdictFilter('unanalyzed')">Unanalyzed</button>
  <span class="refresh-info" id="refreshInfo">—</span>
</div>

<main>
  <div class="deals-grid" id="dealsGrid">
    <div id="loading">Loading deals…</div>
  </div>
</main>

<script>
  let allDeals = [];
  let verdictFilter = 'all';

  function getCategoryEmoji(cat) {
    const m = {
      'TVs': '📺', 'Monitors': '🖥️', 'Laptops': '💻', 'Headphones': '🎧',
      'Smartphones': '📱', 'Tablets': '📟', 'GPUs': '🎮', 'CPUs': '⚙️',
      'SSDs': '💾', 'Cameras': '📷', 'Gaming': '🕹️', 'Gaming Peripherals': '⌨️',
      'Smart Home': '🏠', 'Appliances': '🍳', 'Routers': '📡',
    };
    return m[cat] || '🛒';
  }

  async function loadStats() {
    try {
      const r = await fetch('/api/stats');
      const s = await r.json();
      document.getElementById('statsBar').innerHTML = `
        <div class="stat-chip"><strong>${s.total}</strong> total deals</div>
        <div class="stat-chip"><strong>${s.new_today}</strong> today</div>
        <div class="stat-chip" style="color:#86efac"><strong>${s.great_deals}</strong> great deals</div>
        <div class="stat-chip" style="color:#93c5fd"><strong>${s.good_deals}</strong> good deals</div>
        ${s.categories.slice(0,4).map(c => `<div class="stat-chip">${getCategoryEmoji(c.name)} ${c.name} <strong>${c.count}</strong></div>`).join('')}
      `;
    } catch(e) { /* ignore */ }
  }

  async function loadDeals() {
    try {
      const r = await fetch('/api/deals');
      allDeals = await r.json();
      applyFilters();
      const now = new Date();
      document.getElementById('refreshInfo').textContent =
        `Updated ${now.toLocaleTimeString()}`;
    } catch(e) {
      document.getElementById('dealsGrid').innerHTML =
        '<div class="empty-state"><div style="font-size:2rem">⚠️</div><p>Could not load deals — is the tracker running?</p></div>';
    }
  }

  function setVerdictFilter(v) {
    verdictFilter = v;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.verdict === v);
    });
    applyFilters();
  }

  function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allDeals.filter(d => {
      if (verdictFilter !== 'all') {
        if (verdictFilter === 'unanalyzed' && d.verdict) return false;
        if (verdictFilter !== 'unanalyzed' && d.verdict !== verdictFilter) return false;
      }
      if (q && !d.title.toLowerCase().includes(q) &&
               !(d.store||'').toLowerCase().includes(q) &&
               !(d.category_detected||d.category||'').toLowerCase().includes(q)) return false;
      return true;
    });
    renderDeals(filtered);
  }

  function renderDeals(deals) {
    const grid = document.getElementById('dealsGrid');
    if (!deals.length) {
      grid.innerHTML = '<div class="empty-state"><div style="font-size:2rem">🔍</div><p>No deals match your filters.</p></div>';
      return;
    }
    grid.innerHTML = deals.map(d => {
      const cat = d.category_detected || d.category || 'General';
      const emoji = getCategoryEmoji(cat);
      const discountBadge = d.discount_pct ? `<span class="discount">-${Math.round(d.discount_pct)}%</span>` : '';
      const wasBadge = d.original_price ? `<span class="was">${d.original_price}</span>` : '';
      const verdictBadge = d.verdict
        ? `<span class="badge badge-verdict" style="background:${d.verdict_color}">${d.verdict}</span>`
        : '';
      const imgEl = d.image_url
        ? `<img class="card-img" src="${escHtml(d.image_url)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="card-img-placeholder" style="display:none">${emoji}</div>`
        : `<div class="card-img-placeholder">${emoji}</div>`;
      return `
        <div class="deal-card${d.seen?' seen':''}" id="card-${escHtml(d.id)}">
          ${imgEl}
          <div class="card-body">
            <div class="card-title">${escHtml(d.title)}</div>
            <div class="card-meta">
              ${verdictBadge}
              <span class="badge badge-category">${emoji} ${escHtml(cat)}</span>
              ${d.store ? `<span class="badge badge-store">${escHtml(d.store)}</span>` : ''}
            </div>
            <div class="card-price">
              ${d.price ? escHtml(d.price) : 'N/A'}
              ${wasBadge} ${discountBadge}
            </div>
          </div>
          <div class="card-footer">
            <span class="score">👍 <strong>${d.score}</strong></span>
            <a class="btn-view" href="${escHtml(d.url)}" target="_blank" rel="noopener"
               onclick="markSeen('${escHtml(d.id)}')">View Deal →</a>
          </div>
        </div>`;
    }).join('');
  }

  function escHtml(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function markSeen(id) {
    await fetch(`/api/mark-seen/${encodeURIComponent(id)}`, { method: 'POST' });
    const card = document.getElementById('card-' + id);
    if (card) card.classList.add('seen');
  }

  // Initial load
  loadStats();
  loadDeals();

  // Auto-refresh every 5 minutes
  setInterval(() => { loadStats(); loadDeals(); }, 5 * 60 * 1000);
</script>
</body>
</html>
