services:
  slickdeals-tracker:
    build:
      context: .
      args:
        GIT_HASH: ${GIT_HASH:-dev}
    container_name: slickdeals-tracker
    restart: unless-stopped
    ports:
      - "7001:7001"
    volumes:
      - ./data:/config
    environment:
      # Timezone
      TZ: America/Los_Angeles

      # Pushover notifications (leave blank to use config.yaml values)
      PUSHOVER_TOKEN: ""
      PUSHOVER_USER_KEY: ""
      PUSHOVER_ENABLED: ""

      # Hot deals frontpage monitor (leave blank to use config.yaml values)
      HOT_DEALS_ENABLED: ""
      HOT_DEALS_MIN_SCORE: ""

      # Poll interval in minutes
      POLL_INTERVAL: "30"

      # Paths inside the container (match the volume mount)
      CONFIG_PATH: /config/config.yaml
      DB_PATH: /config/deals.db
